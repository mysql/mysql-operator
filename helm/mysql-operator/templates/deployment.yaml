{{- include "mysql-operator.checkNotDefaultNamespace" . -}}
{{- include "mysql-operator.checkNamespacesExplicitOnly" . -}}
{{- include "mysql-operator.checkDeploymentNameImmutable" . -}}
{{- include "mysql-operator.checkTopologyImmutable" . -}}
{{- include "mysql-operator.checkDeploymentNameLength" . -}}
{{- include "mysql-operator.checkClusterScopedIdentityConflicts" . -}}
{{- include "mysql-operator.checkNoOverlappingOperators" . -}}
{{- $imagePullPolicies := list "ifnotpresent" "always" "never" -}}
{{- $deploymentValues := default (dict) .Values.deployment -}}
{{- if (((.Values).image).pullPolicy) }}
  {{- if not (has (lower (((.Values).image).pullPolicy)) ($imagePullPolicies)) }}
    {{- $err := printf "Unknown image pull policy %s. Must be one of %v" (((.Values).image).pullPolicy) $imagePullPolicies }}
    {{- fail $err }}
  {{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mysql-operator.deploymentName" . }}
  namespace: {{ .Release.Namespace }}
{{- with (include "mysql-operator.deploymentAnnotations" . | trim) }}
  annotations:
{{- . | nindent 4 }}
{{- end }}
  labels:
{{- include "mysql-operator.deployment.deploymentLabels" . | nindent 4 }}
spec:
  replicas: {{ include "mysql-operator.deployment.replicas" . }}
{{ include "mysql-operator.deployment.strategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "mysql-operator.deploymentSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with $deploymentValues.podAnnotations }}
      annotations:
{{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
{{- include "mysql-operator.deployment.podLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
{{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.image.pullSecrets.enabled }}
      imagePullSecrets:
      - name: {{ .Values.image.pullSecrets.secretName }}
      {{- end }}
      containers:
        - name: mysql-operator
          image: {{ if (((.Values).image).registry) }}{{ trimSuffix "/" .Values.image.registry }}/{{- end }}{{- if (((.Values).image).repository) }}{{ trimSuffix "/" .Values.image.repository }}/{{ end }}{{ (required "image.name is required" ((.Values).image).name) }}:{{ default .Chart.AppVersion (((.Values).image).tag) }}
          imagePullPolicy: {{ required "image.pullPolicy is required" (((.Values).image).pullPolicy) | quote }}
          {{- if and ( and ((.Values).debugger) (((.Values).debugger).enabled) ) ( and (((.Values).debugger).bindip) (((.Values).debugger).bindport) )}}
          args: ["mysqlsh", "--log-level=@INFO", "--pym", "debugpy", "--listen", "{{.Values.debugger.bindip}}:{{.Values.debugger.bindport}}", "-m", "mysqloperator", "operator"]
          {{- else }}
          args: ["mysqlsh", "--log-level=@INFO", "--pym", "mysqloperator", "operator"]
          {{- end }}
          env:
          - name: MYSQLSH_USER_CONFIG_HOME
            value: /mysqlsh
          - name: MYSQLSH_CREDENTIAL_STORE_SAVE_PASSWORDS
            value: never
          {{- if (((.Values).envs).imagesDefaultRegistry) }}
          - name: MYSQL_OPERATOR_DEFAULT_REPOSITORY
            value: {{ trimSuffix "/" .Values.envs.imagesDefaultRegistry }}{{ if .Values.envs.imagesDefaultRepository }}/{{ trimSuffix "/" .Values.envs.imagesDefaultRepository }}{{ end }}
          {{- else if (((.Values).envs).imagesDefaultRepository) }}
          - name: MYSQL_OPERATOR_DEFAULT_REPOSITORY
            value: {{ trimSuffix "/" .Values.envs.imagesDefaultRepository }}
          {{- end }}
          {{- if (((.Values).envs).imagesPullPolicy) }}
            {{- if not (has (lower .Values.envs.imagesPullPolicy) ($imagePullPolicies)) }}
              {{- $err := printf "Unknown envs.imagesPullPolicy %s. Must be one of %v" .Values.envs.imagesPullPolicy $imagePullPolicies}}
              {{- fail $err }}
            {{- end }}
          - name: MYSQL_OPERATOR_IMAGE_PULL_POLICY
            value: {{ .Values.envs.imagesPullPolicy | quote }}
          {{- end }}
          {{- if (((.Values).envs).k8sClusterDomain) }}
          - name: MYSQL_OPERATOR_K8S_CLUSTER_DOMAIN
            value: {{ .Values.envs.k8sClusterDomain | quote }}
          {{- end }}
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: OPERATOR_DEPLOYMENT_NAME
            value: {{ include "mysql-operator.deploymentName" . }}
          - name: OPERATOR_PEERING_NAME
            value: {{ include "mysql-operator.envVarPeeringName" . }}
          - name: OPERATOR_ROLE_NAME
            value: {{ include "mysql-operator.operatorRoleName" . }}
          - name: SIDECAR_ROLE_NAME
            value: {{ include "mysql-operator.sidecarRoleName" . }}
          - name: SWITCHOVER_ROLE_NAME
            value: {{ include "mysql-operator.switchoverRoleName" . }}
          # Comma-separated explicit watched namespaces. Empty means cluster-wide.
          # Standalone and non-standalone use the same explicit namespace grammar.
          - name: OPERATOR_NAMESPACES
            value: "{{ include "mysql-operator.namespaces" . }}"
          - name: OPERATOR_STANDALONE
            value: {{ include "mysql-operator.deployment.standalone" . | quote }}
          - name: MYSQL_OPERATOR_DEBUG
            value: "{{ .Values.operatorDebug | int | default 0 }}"
          readinessProbe:
            exec:
              command:
              - cat
              - /tmp/mysql-operator-ready
            initialDelaySeconds: 1
            periodSeconds: 3
          volumeMounts:
            - name: mysqlsh-home
              mountPath: /mysqlsh
            - name: tmpdir
              mountPath: /tmp
          {{- with $deploymentValues.resources }}
          resources:
{{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
{{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: mysqlsh-home
          emptyDir: {}
        - name: tmpdir
          emptyDir: {}
      serviceAccountName: {{ include "mysql-operator.operatorSAName" . }}
      {{- with (include "mysql-operator.deployment.affinity" . | trim) }}
      affinity:
{{- . | nindent 8 }}
      {{- end }}
      {{- with (include "mysql-operator.deployment.nodeSelector" . | trim) }}
      nodeSelector:
{{- . | nindent 8 }}
      {{- end }}
