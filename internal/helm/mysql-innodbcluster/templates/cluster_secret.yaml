{{- $disable_lookups:= .Values.disableLookups }}
{{- $install_namespace := .Release.Namespace }}
{{- $creds := .Values.credentials | default dict -}}
{{- $root_creds := $creds.root | default dict -}}
{{- $ext_secret_name := $root_creds.secretName -}}

{{- if $ext_secret_name }}
  {{- /* Mutually exclusive: credentials.root.secretName vs user/password/host */ -}}
  {{- $root := default dict .Values.credentials.root }}
  {{- $hasUser := and (hasKey $root "user") (ne (toString $root.user) "") }}
  {{- $hasHost := and (hasKey $root "host") (ne (toString $root.host) "") }}
  {{- $hasPass := and (hasKey $root "password") (ne (toString $root.password) "") }}
  {{- if or $hasUser (or $hasHost $hasPass) }}
    {{- fail "credentials.root.secretName is mutually exclusive with credentials.root.user/password/host" }}
  {{- end }}

  {{- /* Best-effort validate the secret when lookups are enabled */ -}}
  {{- if not $disable_lookups }}
    {{- $sec := lookup "v1" "Secret" $install_namespace $ext_secret_name }}
    {{- $code := "" }}
    {{- $reason := "" }}
    {{- if $sec }}
      {{- if hasKey $sec "code" }}{{- $code = toString $sec.code }}{{- end }}
      {{- if hasKey $sec "reason" }}{{- $reason = toString $sec.reason }}{{- end }}
    {{- end }}
    {{- $hasData := and $sec (hasKey $sec "data") }}
    {{- $isForbidden := or (eq $code "403") (eq $reason "Forbidden") }}
    {{- $isNotFound := or (eq $code "404") (eq $reason "NotFound") }}
    {{- if or (not $sec) $isNotFound }}
      {{- $err := printf "credentials.root.secretName: secret '%s' not found in namespace '%s'" $ext_secret_name $install_namespace }}
      {{- fail $err }}
    {{- else if $isForbidden }}
      {{- /* RBAC forbids lookups; continue without failing */}}
    {{- else if $hasData }}
      {{- /* Check required keys in secret data when accessible */}}
      {{- $data := default dict $sec.data }}
      {{- $missing := list }}
      {{- if not (hasKey $data "rootUser") }}{{- $missing = append $missing "rootUser" }}{{- end }}
      {{- if not (hasKey $data "rootHost") }}{{- $missing = append $missing "rootHost" }}{{- end }}
      {{- if not (hasKey $data "rootPassword") }}{{- $missing = append $missing "rootPassword" }}{{- end }}
      {{- if gt (len $missing) 0 }}
        {{- $err := printf "credentials.root.secretName: secret '%s' is missing required key(s): %s" $ext_secret_name (join ", " $missing) }}
        {{- fail $err }}
      {{- end }}
    {{- else }}
      {{- /* Unexpected object shape; continue defensively without failing */}}
    {{- end }}
  {{- end }}
{{- end }}

{{- if not $ext_secret_name }}
  {{- if hasKey $root_creds "secretName" }}
     {{- fail "Validation Error: credentials.root.secretName was provided but is empty. Please provide a valid secret name or remove the key to use manual credentials." -}}
  {{- end }}

  {{- $some_creds_provided := or (not (empty $root_creds.user)) (not (empty $root_creds.host)) -}}

  {{- if empty $root_creds.password }}
    {{- $err := "" -}}
    {{- if hasKey $root_creds "password" }}
      {{- $err = printf "Validation Error: password for user '%s' is explicitly empty. A non-empty password is required." (default "root" $root_creds.user) -}}
    {{- else if $some_creds_provided }}
      {{- /* Key is missing entirely, but user/host were set */ -}}
      {{- $err = printf "Validation Error: password key is missing for user '%s'. Please add the password field." (default "root" $root_creds.user) -}}
    {{- else }}
      {{- /* Everything is missing */ -}}
      {{- $err = "Validation Error: No credentials found. Please provide credentials.root.secretName OR at least credentials.root.password (user and host have defaults)." -}}
    {{- end }}
    {{- fail $err -}}
  {{- end }}
  {{- $cluster_name :=  default "mycluster" .Release.Name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cluster_name }}-cluster-secret
  namespace: {{ .Release.Namespace }}
stringData:
  rootUser: {{ $root_creds.user | default "root" | quote }}
  rootHost: {{ $root_creds.host | default "%%" | quote }}
  rootPassword: {{ $root_creds.password | quote }}
{{- end }}