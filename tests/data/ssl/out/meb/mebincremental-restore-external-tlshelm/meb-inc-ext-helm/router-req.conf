[req]
distinguished_name = req_distinguished_name
x509_extensions = v3_req
prompt = no
[req_distinguished_name]
CN = meb-inc-ext-helm
[v3_req]
basicConstraints = critical, CA:false
keyUsage = critical, digitalSignature
extendedKeyUsage = serverAuth
subjectAltName = @alt_names
[alt_names]
DNS.1 = meb-inc-ext-helm
DNS.2 = meb-inc-ext-helm.mebincremental-restore-external-tlshelm.svc
DNS.3 = meb-inc-ext-helm.mebincremental-restore-external-tlshelm.svc.cluster.local
