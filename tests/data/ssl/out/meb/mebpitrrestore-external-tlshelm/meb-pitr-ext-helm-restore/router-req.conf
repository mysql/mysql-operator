[req]
distinguished_name = req_distinguished_name
x509_extensions = v3_req
prompt = no
[req_distinguished_name]
CN = meb-pitr-ext-helm-restore
[v3_req]
basicConstraints = critical, CA:false
keyUsage = critical, digitalSignature
extendedKeyUsage = serverAuth
subjectAltName = @alt_names
[alt_names]
DNS.1 = meb-pitr-ext-helm-restore
DNS.2 = meb-pitr-ext-helm-restore.mebpitrrestore-external-tlshelm.svc
DNS.3 = meb-pitr-ext-helm-restore.mebpitrrestore-external-tlshelm.svc.cluster.local
